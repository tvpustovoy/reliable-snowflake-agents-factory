<!DOCTYPE html>
<!-- Purpose: Firn coverage map as a sandbox-safe HTML report for a Cortex Agent answer.
     Inputs: synthetic data inlined in #firn-data. Outputs: standalone page. Run: open in a browser. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="snowflake-source" content="cortex-agent-authored" />
  <title>Firn: Business Map</title>
  <script type="application/json" id="snowflake-report-metadata">
  {
    "generated": "2026-10-23",
    "intent": "Firn coverage map: which business zones agents can be trusted with (ACT / DRAFT / ASK) and which agents can be compiled now",
    "dataSources": [
      { "type": "inline", "note": "Fake data, identical to dashboard/streamlit_sis and dashboard/app_runtime. Target source: RECPLACE.MODEL.V_COVERAGE (zone, subzone, facts, carriers, conflicts)." }
    ],
    "sections": [
      { "id": "agents", "title": "Agents we can compile now",
        "producerNotes": "Agent mandate = weakest zone mandate among its required zones. Sorted by mandate, then share of ACT zones." },
      { "id": "map", "title": "Coverage map",
        "producerNotes": "Subzone: ASK if 0 facts; ACT if >=5 facts, >=2 carriers, conflicts/facts < 0.2; else DRAFT. Zone: ACT if >=60% subzones ACT and none ASK; ASK if >=50% ASK; else DRAFT." }
    ]
  }
  </script>
  <script type="application/json" id="firn-data">
  {
    "coverage": {
      "clients_sales": [["qualification",18,4,1],["objections",22,3,2],["closing",15,3,1],["loss_reasons",9,2,1],["retention_churn",7,2,1],["upsell",6,2,0]],
      "founder_rules": [["principles",8,2,0],["sales_rules",14,3,1],["decision_rights",6,2,1]],
      "product": [["value_prop",12,3,1],["features",20,2,1],["limits_bugs",9,3,3],["client_onboarding",6,2,1],["roadmap",3,1,0]],
      "money_pricing": [["tariffs",11,3,4],["discounts_terms",7,2,3],["payments",4,1,0],["revenue",0,0,0],["costs",2,1,0]],
      "team_people": [["roles_ownership",6,2,1],["hiring_leaving",3,1,0],["staff_training",10,2,1],["performance",2,1,1],["workload",0,0,0]],
      "operations": [["processes",9,3,1],["tools_crm",5,2,2],["support_sla",4,2,0]],
      "strategy": [["goals_priorities",5,1,1],["segments_niches",8,3,1],["competitors",3,2,1],["partners",0,0,0]],
      "marketing": [["positioning",4,2,1],["channels",0,0,0],["campaigns_content",0,0,0],["brand_reputation",2,1,0],["funnel_metrics",0,0,0]],
      "other": [["other",3,2,0]]
    },
    "agents": [
      ["Chief of Staff", "Founder's deputy across all zones", "ALL"],
      ["Sales Closer", "Push stalled deals to close", ["clients_sales","founder_rules","product"]],
      ["Sales Onboarding Coach", "Train new salespeople the house way", ["team_people","founder_rules","operations"]],
      ["Retention Guard", "Spot sleeping clients and win them back", ["clients_sales","product","operations"]],
      ["Pricing Advisor", "Recommend tariffs and discounts", ["money_pricing","strategy"]],
      ["Marketing Analyst", "Find channels that bring paying clients", ["marketing","strategy"]]
    ]
  }
  </script>
  <style>
    :root {
      color-scheme: light dark;
      --fg: light-dark(#1b2330, #e5e7eb);
      --muted: light-dark(#6b7585, #9aa4b2);
      --card: light-dark(#ffffff, #1c2330);
      --line: light-dark(#e3e7ee, #2e3746);
      --act: light-dark(#2e9d5b, #4cc27c);   --act-bg: light-dark(#e8f6ee, #15301f);
      --draft: light-dark(#b97d06, #e6b44a); --draft-bg: light-dark(#fdf4e1, #33290f);
      --ask: light-dark(#d64545, #f07070);   --ask-bg: light-dark(#fdeaea, #3a1a1a);
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, system-ui, sans-serif; color: var(--fg);
      background: light-dark(#f6f8fb, #11161f);
      max-width: 1100px; width: 100%; margin: 0 auto; padding: clamp(16px, 4vw, 24px);
    }
    h1 { margin: 0 0 4px; font-size: clamp(22px, 4vw, 28px); }
    h2 { margin: 28px 0 12px; font-size: 19px; }
    .sub { color: var(--muted); margin: 0 0 8px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 12px; }
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-top: 20px; }
    .card { background: var(--card); border-radius: 10px; padding: 14px 16px; border: 1px solid var(--line); }
    .kpi .label { color: var(--muted); font-size: 13px; }
    .kpi .value { font-size: 26px; font-weight: 650; }
    .badge { display: inline-block; border: 1px solid currentColor; border-radius: 10px; padding: 0 8px; font-size: 11px; font-weight: 700; }
    .m-ACT { color: var(--act); }   .bg-ACT { background: var(--act-bg); border-color: var(--act); }
    .m-DRAFT { color: var(--draft); } .bg-DRAFT { background: var(--draft-bg); border-color: var(--draft); }
    .m-ASK { color: var(--ask); }   .bg-ASK { background: var(--ask-bg); border-color: var(--ask); }
    .agent { display: flex; flex-direction: column; gap: 3px; border-left-width: 5px; }
    .agent small { color: var(--muted); }
    .agent small b { color: var(--fg); }
    .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .rec { align-self: flex-start; background: var(--act); color: #fff; border-radius: 4px; padding: 1px 6px; font-size: 11px; font-weight: 700; margin-bottom: 4px; }
    button.create { margin-top: 10px; padding: 8px 12px; border-radius: 8px; font-weight: 650; cursor: pointer; font: inherit; font-weight: 650; background: var(--card); }
    button.create.ACT { background: var(--act); color: #fff; border: 1px solid var(--act); }
    button.create.DRAFT { color: var(--draft); border: 1px solid var(--draft); }
    button.create.ASK { color: var(--ask); border: 1px dashed var(--ask); }
    .done { margin-top: 6px; font-size: 13px; font-weight: 600; }
    .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0; }
    .chip { border: 1px solid var(--muted); background: var(--card); color: var(--fg); border-radius: 14px; padding: 4px 12px; font: inherit; font-size: 13px; cursor: pointer; }
    .chip.on { background: var(--fg); color: var(--card); border-color: var(--fg); }
    .chip.m.on.ACT { background: var(--act); border-color: var(--act); color: #fff; }
    .chip.m.on.DRAFT { background: var(--draft); border-color: var(--draft); color: #fff; }
    .chip.m.on.ASK { background: var(--ask); border-color: var(--ask); color: #fff; }
    .zone { border-width: 2px; }
    .zone .hint { color: var(--muted); font-size: 12px; }
    .zone hr { border: 0; border-top: 1px solid var(--line); margin: 8px 0; }
    .sz { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; padding: 2px 0; flex-wrap: wrap; }
    .sz span:last-child { color: var(--muted); }
    code { font-size: 12px; }
    .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--muted); }
  </style>
</head>
<body>
  <h1>Firn: what we know about the business</h1>
  <p class="sub">Fake data · zones from BUSINESS_MODEL.md · mandate ACT / DRAFT / ASK</p>
  <div class="legend">
    <span><span class="badge m-ACT">ACT</span> agent may act</span>
    <span><span class="badge m-DRAFT">DRAFT</span> agent drafts, founder approves</span>
    <span><span class="badge m-ASK">ASK</span> agent must ask, data is missing</span>
  </div>

  <section class="kpis" id="kpis"></section>

  <h2 id="agents">Agents we can compile now</h2>
  <section class="grid" id="agent-list"></section>

  <h2 id="map">Coverage map</h2>
  <div class="filters" id="f-mandate"><b>Mandate</b></div>
  <div class="filters" id="f-zone"><b>Zones</b></div>
  <section class="grid" id="zone-list"></section>

  <script>
    const DATA = JSON.parse(document.getElementById('firn-data').textContent);
    const RANK = { ACT: 2, DRAFT: 1, ASK: 0 };
    const HINT = { ACT: 'Agent may act', DRAFT: 'Agent drafts, founder approves', ASK: 'Agent must ask, data is missing' };
    const CREATE = {
      ACT: ['Create agent', 'Compiled with ACT mandate: acts on its own within its zones.'],
      DRAFT: ['Create with approvals', 'Compiled with DRAFT mandate: every action goes to the founder for approval.'],
      ASK: ['\u26a0 Create anyway', 'Compiled with ASK mandate: knowledge is thin, the agent will ask before acting.'],
    };

    // Coverage rule: covered >=5 facts from >=2 carriers; blind 0 -> ASK; conflicts force DRAFT
    const subMandate = (f, c, k) => f === 0 ? 'ASK' : (f >= 5 && c >= 2 && k / f < 0.2 ? 'ACT' : 'DRAFT');
    const zoneMandate = (subs) => {
      const share = (m) => subs.filter((s) => s.mandate === m).length / subs.length;
      if (share('ACT') >= 0.6 && share('ASK') === 0) return 'ACT';
      return share('ASK') >= 0.5 ? 'ASK' : 'DRAFT';
    };

    const ZONES = Object.entries(DATA.coverage).map(([zone, rows]) => {
      const subs = rows.map(([name, facts, carriers, conflicts]) =>
        ({ name, facts, carriers, conflicts, mandate: subMandate(facts, carriers, conflicts) }));
      return { zone, subs, mandate: zoneMandate(subs) };
    });
    const BY_ZONE = Object.fromEntries(ZONES.map((z) => [z.zone, z]));
    const ZONE_NAMES = ZONES.map((z) => z.zone);

    const AGENTS = DATA.agents.map(([name, mission, req]) => {
      const zones = req === 'ALL' ? ZONE_NAMES.filter((z) => z !== 'other') : req;
      const m = zones.map((z) => BY_ZONE[z].mandate).reduce((a, b) => (RANK[a] <= RANK[b] ? a : b));
      return {
        name, mission, zones, m, all: req === 'ALL',
        weak: zones.filter((z) => BY_ZONE[z].mandate !== 'ACT'),
        gaps: zones.flatMap((z) => BY_ZONE[z].subs.filter((s) => s.mandate === 'ASK').map((s) => s.name)),
        trusted: zones.filter((z) => BY_ZONE[z].mandate === 'ACT').length / zones.length,
      };
    }).sort((a, b) => RANK[b.m] - RANK[a.m] || b.trusted - a.trusted);

    const state = { mandates: new Set(Object.keys(RANK)), zones: new Set(ZONE_NAMES), created: new Set() };

    // Small DOM helper: text content only, never innerHTML with data
    function el(tag, cls, text) {
      const n = document.createElement(tag);
      if (cls) n.className = cls;
      if (text !== undefined) n.textContent = text;
      return n;
    }
    const badge = (m) => el('span', 'badge m-' + m, m);
    function line(label, value) {
      const s = el('small');
      s.append(el('b', '', label + ': '), value);
      return s;
    }

    function renderKpis() {
      const all = ZONES.flatMap((z) => z.subs);
      const kpis = [
        ['Facts', all.reduce((s, x) => s + x.facts, 0)],
        ['Zones trusted to act', ZONES.filter((z) => z.mandate === 'ACT').length + ' / ' + ZONES.length],
        ['Blind subzones', all.filter((x) => x.mandate === 'ASK').length],
        ['Conflicts', all.reduce((s, x) => s + x.conflicts, 0)],
      ];
      const box = document.getElementById('kpis');
      kpis.forEach(([label, value]) => {
        const c = el('div', 'card kpi');
        c.append(el('div', 'label', label), el('div', 'value', String(value)));
        box.append(c);
      });
    }

    function renderAgents() {
      const box = document.getElementById('agent-list');
      box.replaceChildren();
      AGENTS.forEach((a, i) => {
        const c = el('div', 'card agent bg-' + a.m);
        if (i === 0) c.append(el('span', 'rec', 'RECOMMENDED'));
        const head = el('div', 'head');
        head.append(el('strong', '', a.name), badge(a.m));
        c.append(head, el('div', '', a.mission), el('small', '', HINT[a.m]),
          line('Zones', a.all ? 'all' : a.zones.join(', ')),
          line('Holds back', a.weak.join(', ') || 'nothing'),
          line('Fill next', a.gaps.slice(0, 4).join(', ') || 'no blind spots'));
        const btn = el('button', 'create ' + a.m, CREATE[a.m][0]);
        btn.type = 'button';
        btn.addEventListener('click', () => { state.created.add(a.name); renderAgents(); });
        c.append(btn);
        if (state.created.has(a.name)) c.append(el('div', 'done m-' + a.m, '\u2713 ' + CREATE[a.m][1]));
        box.append(c);
      });
    }

    function renderFilters() {
      const mk = (boxId, values, set, extra) => {
        const box = document.getElementById(boxId);
        box.querySelectorAll('button').forEach((b) => b.remove());
        values.forEach((v) => {
          const b = el('button', 'chip ' + extra + ' ' + v + (set.has(v) ? ' on' : ''), v);
          b.type = 'button';
          b.addEventListener('click', () => {
            set.has(v) ? set.delete(v) : set.add(v);
            renderFilters(); renderZones();
          });
          box.append(b);
        });
      };
      mk('f-mandate', Object.keys(RANK), state.mandates, 'm');
      mk('f-zone', ZONE_NAMES, state.zones, '');
    }

    function renderZones() {
      const box = document.getElementById('zone-list');
      box.replaceChildren();
      const shown = ZONES.filter((z) => state.mandates.has(z.mandate) && state.zones.has(z.zone));
      shown.forEach((z) => {
        const c = el('div', 'card zone bg-' + z.mandate);
        const head = el('div', 'head');
        head.append(el('strong', '', z.zone), badge(z.mandate));
        c.append(head, el('div', 'hint', HINT[z.mandate]), el('hr'));
        z.subs.forEach((s) => {
          const row = el('div', 'sz');
          const left = el('span');
          left.append(badge(s.mandate), ' ', el('code', '', s.name));
          row.append(left, el('span', '', s.facts + ' facts \u00b7 ' + s.conflicts + ' conflicts'));
          c.append(row);
        });
        box.append(c);
      });
      if (!shown.length) box.append(el('p', 'sub', 'No zones match the filter.'));
    }

    renderKpis(); renderAgents(); renderFilters(); renderZones();
  </script>
</body>
</html>
